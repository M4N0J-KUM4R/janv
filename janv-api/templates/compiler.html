<div class="space-y-6">
    <!-- Header -->
    <div class="space-y-1">
        <h1 class="text-4xl font-black text-white uppercase tracking-tight font-sans">Online IDE Compiler</h1>
        <p class="text-xs text-gray-400 font-mono uppercase tracking-wider">Execute program units inside secure remote compiler containers.</p>
    </div>

    <!-- Main Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Code Editor Panel -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-[#262426] overflow-hidden border border-white/5">
                <!-- Editor Top Header (Mock Tabs) -->
                <div class="bg-[#1c1b1c] px-6 py-4 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="bg-[#141314] px-4 py-1.5 text-xs text-[#fd551d] font-mono flex items-center gap-2 border-b-2 border-[#fd551d]">
                            📄 workspace.code
                        </div>
                    </div>
                    
                    <select name="language" id="lang-select" 
                        class="bg-[#1c1b1c] border-b-2 border-gray-800 focus:border-[#fd551d] px-3 py-1.5 text-xs text-gray-300 focus:outline-none font-mono font-bold">
                        {% for lang in languages %}
                        <option value="{{ lang }}">{{ lang|capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Editor body -->
                <div class="p-6 bg-[#141314]/20">
                    <textarea name="code" id="editor" rows="18" required 
                        placeholder="// Write code here...&#10;fn main() {&#10;    println!(&quot;Hello, World!&quot;);&#10;}"
                        class="w-full bg-[#141314] border-b-2 border-gray-800 focus:border-[#fd551d] p-5 font-mono text-xs text-gray-100 focus:outline-none transition resize-none leading-relaxed"></textarea>
                </div>

                <!-- Editor Action Footer -->
                <div class="bg-[#1c1b1c] px-6 py-4 flex justify-end">
                    <button hx-post="/compiler/run" 
                        hx-include="#editor, #lang-select, #stdin-input"
                        hx-target="#output-pane"
                        hx-indicator="#run-indicator"
                        class="bg-[#fd551d] hover:bg-[#c53000] text-white font-extrabold px-6 py-3 transition duration-200 text-xs tracking-widest uppercase font-mono">
                        Run Code
                    </button>
                </div>
            </div>
        </div>

        <!-- Inputs / Terminal outputs -->
        <div class="space-y-6 lg:col-span-1">
            <!-- Stdin Box -->
            <div class="bg-[#262426] p-6 space-y-4">
                <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest font-mono">Input Parameter (stdin)</label>
                <textarea id="stdin-input" name="stdin" rows="4" placeholder="Provide stdin arguments here..."
                    class="w-full bg-[#141314] border-b-2 border-gray-800 focus:border-[#fd551d] p-3 font-mono text-xs text-gray-300 focus:outline-none transition resize-none"></textarea>
            </div>

            <!-- Terminal output Box -->
            <div class="bg-[#262426] p-6 flex flex-col min-h-[360px] border border-white/5 overflow-hidden">
                <div class="flex justify-between items-center border-b border-[#333033] pb-3 mb-4">
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest font-mono">Execution Shell</label>
                    <span id="run-indicator" class="htmx-indicator text-[#fd551d] text-xs font-bold font-mono animate-pulse tracking-widest">COMPILING...</span>
                </div>

                <!-- Shell Body -->
                <div id="output-pane" class="flex-1 flex flex-col justify-center bg-[#141314] p-4 font-mono text-[11px] text-gray-300">
                    <div class="text-center text-gray-600 uppercase tracking-wider text-[10px]">
                        Shell inactive. Execute code module.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
