version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-production-jwt-secret-key-32chars}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-admin@janv.dev}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-admin123}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000

  redis:
    image: redis:7-alpine
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
